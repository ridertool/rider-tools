name: news
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: news
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/news.mjs
      - name: data 브랜치에 올리기 (main은 건드리지 않음 → 사이트 재배포 없음)
        run: |
          mkdir /tmp/d && cp news.json /tmp/d/ && cd /tmp/d
          git init -q -b data && git config user.name news-bot && git config user.email news-bot@users.noreply.github.com
          git add news.json && git commit -qm "news $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
