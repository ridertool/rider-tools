html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-text-size-adjust:100%}
a{color:inherit}

.hint{margin:10px 0 0;color:var(--muted);font-size:13.5px;text-align:center;word-break:keep-all}
.msg{margin:8px 0 0;text-align:center;font-weight:800;min-height:1.4em}
.stage{position:relative}

.rk-note{margin:10px 0 0;font-size:12.5px;color:var(--muted)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;scrollbar-width:none}

.tab{flex:0 0 auto;min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-weight:800;font-size:14.5px;cursor:pointer}

.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;color:var(--muted);font-size:13px;font-weight:700}

.nl{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.nl .s{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);font-weight:500}

.note{margin:12px 0 0;font-size:12.5px;color:var(--muted)}

.wx{border:2px solid var(--ink);border-radius:18px;background:var(--card);padding:14px 16px;margin:0 0 16px}
.wx-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wx-top select{min-height:40px;border:2px solid var(--ink);border-radius:10px;background:#fff;font:inherit;font-weight:800;padding:0 8px;max-width:55%}
.wx-top .btn{min-height:40px;padding:0 12px;font-size:13.5px;background:var(--card)}
.wx-now{display:flex;align-items:center;gap:14px;margin:10px 0 4px}
.wx-ic{font-size:54px;line-height:1}
.wx-t{font-family:var(--display);font-size:46px;line-height:1}
.wx-d{font-weight:700;color:var(--muted);font-size:14px;line-height:1.45}

.wx-alert.ok{background:#dcfce7;border-color:#15803d;color:#14532d}
.wx-h{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;text-align:center;font-size:12.5px;font-weight:700}
.wx-h div{background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 0}

.wx-h em{font-style:normal;display:block;font-size:20px}
.wx-h i{font-style:normal;color:#1d4ed8;font-size:12px}
.wx-air{display:flex;gap:8px;margin-top:8px;font-size:13.5px;font-weight:800}
.wx-air span{flex:1;text-align:center;border:2px solid var(--line);border-radius:10px;padding:5px;background:#fff}
</style>

  var POS=[['라이더',3],['배달기사',3],['배달원',3],['이륜차',3],['오토바이',2],['배달 플랫폼',2],['배달플랫폼',2],['배달앱',1],['수수료',1],['산재',2],['보험',1],['안전',1],['교통',1],['헬멧',2],['단속',1],['배민',1],['쿠팡이츠',1],['요기요',1],['배달비',1],['배달료',1],['택배',1],['플랫폼 노동',2]],NEG=[['소상공인',-2],['프랜차이즈',-2],['점주',-2],['자영업',-2],['맛집',-2],['메뉴',-1]];

(function(){
  function $(i){return document.getElementById(i)}
  var CITY=[['서울',37.5665,126.978],['인천',37.4563,126.7052],['수원',37.2636,127.0286],['성남',37.42,127.1265],['고양',37.6584,126.832],['부산',35.1796,129.0756],['대구',35.8714,128.6014],['대전',36.3504,127.3845],['광주',35.1595,126.8526],['울산',35.5384,129.3114],['창원',35.2285,128.6811],['청주',36.6424,127.489],['전주',35.8242,127.148],['제주',33.4996,126.5312]];
  var sel=$('wx-city'),body=$('wx-body'),seq=0,cur=null;
  CITY.forEach(function(c,i){var o=document.createElement('option');o.value=i;o.textContent=c[0];sel.appendChild(o)});
  var o=document.createElement('option');o.value='loc';o.textContent='내 위치';o.hidden=true;sel.appendChild(o);
  function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ic(c,day){if(c===0)return day?'☀️':'🌙';if(c<=2)return day?'🌤️':'☁️';if(c===3)return '☁️';if(c<=48)return '🌫️';if(c<=57)return '🌦️';if(c<=67)return '🌧️';if(c<=77)return '❄️';if(c<=82)return '🌧️';if(c<=86)return '🌨️';return '⛈️'}
  function nm(c){if(c===0)return '맑음';if(c<=2)return '대체로 맑음';if(c===3)return '흐림';if(c<=48)return '안개';if(c<=57)return '이슬비';if(c<=67)return '비';if(c<=77)return '눈';if(c<=82)return '소나기';if(c<=86)return '눈 소나기';return '천둥번개'}
  function pm(v,l){if(v==null)return '-';return v<=l[0]?'좋음':v<=l[1]?'보통':v<=l[2]?'나쁨':'매우 나쁨'}
  function show(d,a,label){
    var c=d.current,h=d.hourly,now=c.time,idx=h.time.indexOf(now.slice(0,13)+':00');if(idx<0)idx=0;
    var day=c.is_day===1,rainNext=0,when='';
    for(var i=idx;i<idx+6&&i<h.time.length;i++){var pr=h.precipitation_probability[i]||0;if(pr>rainNext){rainNext=pr;when=h.time[i].slice(11,13)+'시'}}
    var wet=c.precipitation>0||rainNext>=50;
    var html='<div class="wx-now"><div class="wx-ic" aria-hidden="true">'+ic(c.weather_code,day)+'</div><div><div class="wx-t">'+Math.round(c.temperature_2m)+'°</div></div><div class="wx-d">'+label+' · '+nm(c.weather_code)+'<br>체감 '+Math.round(c.apparent_temperature)+'° · 바람 '+Math.round(c.wind_speed_10m)+'km/h</div></div>';
    html+='<div class="wx-alert'+(wet?'':' ok')+'">'+(c.precipitation>0?'☔ 지금 비가 오고 있어요. 우의 챙기세요!':rainNext>=50?'☔ '+when+'쯤 비 올 확률 '+rainNext+'%. 우의 챙기세요!':'✅ 앞으로 6시간 비 걱정은 적어요 (최대 '+rainNext+'%)')+'</div>';
    html+='<div class="wx-h">';
    for(var k=1;k<=12&&idx+k<h.time.length;k+=2){var j=idx+k,hr=+h.time[j].slice(11,13);html+='<div><b>'+hr+'시</b><em>'+ic(h.weather_code[j],hr>=6&&hr<19)+'</em>'+Math.round(h.temperature_2m[j])+'°<br><i>'+(h.precipitation_probability[j]||0)+'%</i></div>'}
    html+='</div>';
    if(a&&a.current)html+='<div class="wx-air"><span>미세먼지 '+pm(a.current.pm10,[30,80,150])+'</span><span>초미세먼지 '+pm(a.current.pm2_5,[15,35,75])+'</span></div>';
    body.innerHTML=html;
  }
  function get(lat,lon,label){
    var my=++seq,u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Asia%2FSeoul&forecast_days=2&wind_speed_unit=kmh';
    var ua='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon+'&current=pm10,pm2_5&timezone=Asia%2FSeoul';
    cur=[lat,lon,label];
    Promise.all([fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}),fetch(ua).then(function(r){return r.ok?r.json():null}).catch(function(){return null})])
    .then(function(r){if(my===seq)show(r[0],r[1],label)}).catch(function(){if(my===seq)body.innerHTML='<p class="wx-d">날씨를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>'});
  }
  function dong(lat,lon,cb){fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=ko&lat='+lat+'&lon='+lon).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){var a=(j&&j.address)||{},g=a.city_district||a.county||'',d=a.suburb||a.quarter||a.neighbourhood||a.village||'';cb(g&&d?g+' '+d:(d||g||''))}).catch(function(){cb('')})}
  function gotLoc(la,lo){var nm0='';try{localStorage.setItem('wx_loc',JSON.stringify({lat:la,lon:lo,ts:Date.now(),name:''}))}catch(e){}sel.value='loc';get(la,lo,'내 위치');dong(la,lo,function(nn){if(!nn)return;try{localStorage.setItem('wx_loc',JSON.stringify({lat:la,lon:lo,ts:Date.now(),name:nn}))}catch(e){}get(la,lo,nn)})}
  function pick(i){var c=CITY[i];sset('wx_city',i);get(c[1],c[2],c[0])}
  sel.addEventListener('change',function(){if(sel.value!=='loc')pick(+sel.value)});
  $('wx-loc').addEventListener('click',function(){
    if(!navigator.geolocation){body.innerHTML='<p class="wx-d">이 기기에서는 위치를 쓸 수 없어요. 지역을 직접 골라 주세요.</p>';return}
    body.innerHTML='<p class="wx-d">위치 확인 중…</p>';
    navigator.geolocation.getCurrentPosition(function(p){gotLoc(Math.round(p.coords.latitude*1000)/1000,Math.round(p.coords.longitude*1000)/1000);if(window.gtag)gtag('event','weather_locate')},
      function(){body.innerHTML='<p class="wx-d">위치 권한이 없어요. 지역을 직접 골라 주세요.</p>'},{timeout:8000,maximumAge:600000});
  });
  var sl=null;try{sl=JSON.parse(localStorage.getItem('wx_loc'))}catch(e){}
  if(sl&&sl.lat&&Date.now()-sl.ts<24*3600e3){sel.value='loc';get(sl.lat,sl.lon,sl.name||'내 위치')}
  else{var i0=+sget('wx_city');if(!(i0>=0&&i0<CITY.length))i0=0;sel.value=i0;pick(i0);if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){gotLoc(Math.round(p.coords.latitude*1000)/1000,Math.round(p.coords.longitude*1000)/1000)},function(){},{enableHighAccuracy:true,timeout:10000,maximumAge:300000})}
  setInterval(function(){if(!document.hidden&&cur)get(cur[0],cur[1],cur[2])},600000);
})();
</script>
<script src="../site-config.js"></script>
<script src="../nav.js" defer></script>
<script src="../ads.js"></script>
</body>
